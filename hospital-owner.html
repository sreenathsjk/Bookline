<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2430">
<title>Clinic dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#0d2430; --plum:#0f4a52; --mul:#1c7a82; --gold:#8fd6c8; --gold-d:#3f9c8e;
    --bg:#f3f6f6; --line:#dde7e6; --mut:#5c7278; --ok:#1f8a5c; --ok-bg:#e4f4ec;
    --err:#b73a3a; --err-bg:#f8e9e9; --warn:#a5814d; --warn-bg:#f5eee0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--gold-d);outline-offset:2px}
  .wrap{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  /* ---------- login ---------- */
  .login{flex:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#06181d,var(--plum) 72%,#155c66);color:#f3e9ee;padding:32px}
  .login-card{width:100%;max-width:360px}
  .login-card .kicker{color:var(--gold);font-size:.95rem}
  .login-card h1{font-weight:300;font-size:2.4rem;margin:6px 0 26px}
  .field{display:block;margin-bottom:14px}
  .field>span{display:block;font-size:.88rem;color:#cdbcc6;margin-bottom:6px}
  .field input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:16px}
  .field input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .field input::placeholder{color:#a3919c}
  .b-gold{width:100%;border:0;border-radius:14px;background:var(--gold);color:var(--ink);padding:15px;font-weight:500;font-size:1rem;margin-top:8px}
  .b-gold:disabled{opacity:.6;cursor:default}
  .err-txt{color:#f3a6a6;font-size:.88rem;min-height:1.2em;margin-top:8px}

  /* ---------- header ---------- */
  header{background:linear-gradient(165deg,#06181d,var(--plum) 82%);color:#f3e9ee;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 26px;position:sticky;top:0;z-index:5}
  .h-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .h-top h1{font-weight:300;font-size:1.7rem;margin:0}
  .h-top .kicker{color:var(--gold);font-size:.85rem;margin-bottom:4px}
  .icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#f3e9ee;border-radius:10px;padding:9px 13px;font-size:.85rem}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
  .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:1.6rem;font-weight:400;color:#fff}
  .stat span{font-size:.72rem;color:#cdbcc6}

  /* ---------- main ---------- */
  main{flex:1;padding:18px 20px 40px}
  .toolbar{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px 4px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:.9rem;color:var(--mut)}
  .chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
  .export{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}

  .day-group{margin-bottom:22px}
  .day-h{font-size:.85rem;color:var(--mut);margin-bottom:8px;padding-left:2px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
  .c-top{display:flex;justify-content:space-between;gap:10px}
  .c-name{font-weight:500;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .c-time{font-weight:500;color:var(--mul);white-space:nowrap}
  .c-meta{color:var(--mut);font-size:.9rem;margin-top:3px}
  .badge{font-size:.7rem;font-weight:500;padding:3px 9px;border-radius:999px}
  .badge.pending{background:var(--warn-bg);color:var(--warn)}
  .badge.reminded{background:var(--ok-bg);color:var(--ok)}
  .badge.noshow{background:var(--err-bg);color:var(--err)}
  .c-actions{display:flex;gap:8px;margin-top:12px}
  .c-actions a,.c-actions button{flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:.85rem;font-weight:500;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:transparent}
  .c-actions a.wa{background:#e7f7ee;border-color:#c9ebd8;color:#1d7a4a}
  .c-actions button.on{background:var(--err);color:#fff;border-color:var(--err)}

  .state{text-align:center;padding:60px 16px;color:var(--mut)}
  .state svg{color:var(--line);margin-bottom:12px}
  .err-box{background:var(--err-bg);color:var(--err);border-radius:14px;padding:16px;margin:0 0 16px;font-size:.92rem}
  .sk{background:linear-gradient(90deg,#efe8ec 25%,#f8f4f6 50%,#efe8ec 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:14px;height:88px;margin-bottom:10px}
  @keyframes sh{to{background-position:-200% 0}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  @media(min-width:720px){ .wrap{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
</style>
</head>
<body>
<div class="wrap">

  <div class="login" id="loginView">
    <div class="login-card">
      <div class="kicker">Clinic dashboard</div>
      <h1>Sign in</h1>
      <label class="field"><span>Email</span><input id="loginEmail" type="email" autocomplete="username" placeholder="you@clinic.com"></label>
      <label class="field"><span>Password</span><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
      <button class="b-gold" id="loginBtn">Sign in</button>
      <div class="err-txt" id="loginErr"></div>
    </div>
  </div>

  <div id="appView" hidden>
    <header>
      <div class="h-top">
        <div>
          <div class="kicker" id="kicker">Clinic dashboard</div>
          <img id="logoImg" alt="" hidden style="height:28px;margin-bottom:4px;border-radius:6px">
          <h1 id="salonName">Bookline</h1>
        </div>
        <button class="icon-btn" id="logoutBtn">Log out</button>
      </div>
      <div class="stats" id="statsBar"></div>
    </header>
    <main>
      <div class="toolbar">
        <button class="chip on" data-f="upcoming">Upcoming</button>
        <button class="chip" data-f="today">Today</button>
        <button class="chip" data-f="past">Past</button>
        <button class="export" id="exportBtn">Export PDF</button>
      </div>
      <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    </main>
  </div>
</div>

<script>
/* ============ Firebase config (same as book.html) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDvv_BQGPWCjTyrBpOvtZZyNkFg1a9ugCo",
  authDomain: "bookline-280c4.firebaseapp.com",
  projectId: "bookline-280c4",
  storageBucket: "bookline-280c4.firebasestorage.app",
  messagingSenderId: "1066747513253",
  appId: "1:1066747513253:web:d0c7f3c79fc0b576dac04c"
};
/* =============================================================== */

if (typeof firebase === 'undefined' || firebaseConfig.apiKey === 'YOUR_API_KEY') {
  document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Setup not finished. Add your Firebase config and open this page from your hosted link.</p>';
  throw new Error('Setup incomplete');
}

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const salonId = new URLSearchParams(location.search).get('salon');
const badgeLabel = { pending:'Not reminded', reminded:'Reminded', noshow:'No-show' };

const pad = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
function tomorrowISO(){ const d = new Date(); d.setDate(d.getDate()+1); return isoOf(d); }
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function dayLabel(iso){
  if (iso === todayISO()) return 'Today';
  if (iso === tomorrowISO()) return 'Tomorrow';
  return parseISO(iso).toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'short'});
}
const SLOT_ORDER = ["7:00 AM","7:30 AM","8:00 AM","8:30 AM","9:00 AM","9:30 AM","10:00 AM","10:30 AM","11:00 AM","11:30 AM",
  "12:00 PM","12:30 PM","1:00 PM","1:30 PM","2:00 PM","2:30 PM","3:00 PM","3:30 PM","4:00 PM",
  "4:30 PM","5:00 PM","5:30 PM","6:00 PM","6:30 PM","7:00 PM","7:30 PM","8:00 PM"];

if (!salonId){
  document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">This link is missing its salon id.</p>';
} else {
  $('loginBtn').addEventListener('click', doLogin);
  $('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  auth.onAuthStateChanged(user => user ? enter(user) : showLogin());
  document.getElementById('logoutBtn').addEventListener('click', () => {
    if (unsubList) { unsubList(); unsubList = null; }
    auth.signOut();
  });
}

function showLogin(){
  $('loginView').hidden = false;
  $('appView').hidden = true;
  if (unsubList) { unsubList(); unsubList = null; }
}

function doLogin(){
  const email = $('loginEmail').value.trim();
  const pass = $('loginPass').value;
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Signing in…';
  auth.signInWithEmailAndPassword(email, pass).catch(() => {
    $('loginErr').textContent = 'That email or password isn’t right. Try again.';
  }).finally(() => { $('loginBtn').disabled = false; $('loginBtn').textContent = 'Sign in'; });
}

let salonRef = null, salon = null, unsubList = null, currentAppts = [], filter = 'upcoming';

async function enter(user){
  salonRef = db.collection('salons').doc(salonId);
  let doc;
  try{ doc = await salonRef.get(); }
  catch(e){ document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Couldn’t load this dashboard. Check your connection and refresh.</p>'; return; }

  if (!doc.exists){
    $('list').innerHTML = '<div class="err-box">This clinic isn’t set up yet.</div>';
    $('loginView').hidden = true; $('appView').hidden = false;
    return;
  }
  salon = doc.data();
  if (salon.ownerUid !== user.uid){
    $('list').innerHTML = '<div class="err-box">This login isn’t linked to this clinic’s dashboard.</div>';
    $('loginView').hidden = true; $('appView').hidden = false;
    $('statsBar').innerHTML = '';
    return;
  }

  $('salonName').textContent = salon.name || 'Bookline';
  document.title = (salon.name || 'Bookline') + ' – Dashboard';
  if (salon.accentColor && /^#[0-9a-f]{6}$/i.test(salon.accentColor)){
    document.documentElement.style.setProperty('--plum', salon.accentColor);
  }
  if (salon.logoUrl){
    $('logoImg').src = salon.logoUrl;
    $('logoImg').hidden = false;
    $('kicker').hidden = true;
  }
  $('loginView').hidden = true;
  $('appView').hidden = false;

  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on'); filter = c.dataset.f; render();
  }));
  $('exportBtn').addEventListener('click', exportPdf);
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'remind') markStatus(b.dataset.id, 'reminded');
    if (b.dataset.act === 'noshow') markStatus(b.dataset.id, 'noshow');
    if (b.dataset.act === 'cancel') cancelAppt(b.dataset.id);
  });

  watch();
}

function watch(){
  if (unsubList) unsubList();
  unsubList = salonRef.collection('appointments').onSnapshot(snap => {
    currentAppts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => a.date !== b.date ? (a.date < b.date ? -1 : 1) : SLOT_ORDER.indexOf(a.time) - SLOT_ORDER.indexOf(b.time));
    render();
  }, () => { $('list').innerHTML = '<div class="err-box">Couldn’t load bookings.</div>'; });
}

function render(){
  const all = currentAppts;
  const today = todayISO();
  const reminded = all.filter(a => a.status === 'reminded').length;
  const noshow = all.filter(a => a.status === 'noshow').length;
  $('statsBar').innerHTML =
    '<div class="stat"><b>' + all.length + '</b><span>Total bookings</span></div>' +
    '<div class="stat"><b>' + reminded + '</b><span>Reminded</span></div>' +
    '<div class="stat"><b>' + noshow + '</b><span>No-shows</span></div>';

  let shown;
  if (filter === 'today') shown = all.filter(a => a.date === today);
  else if (filter === 'past') shown = all.filter(a => a.date < today).reverse();
  else shown = all.filter(a => a.date >= today);

  const list = $('list');
  if (shown.length === 0){
    list.innerHTML = '<div class="state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><div>No ' + esc(filter) + ' bookings.</div></div>';
    return;
  }

  const groups = [];
  let curDate = null, curArr = null;
  shown.forEach(a => {
    if (a.date !== curDate){ curDate = a.date; curArr = []; groups.push([curDate, curArr]); }
    curArr.push(a);
  });

  list.innerHTML = groups.map(([date, appts]) =>
    '<div class="day-group"><div class="day-h">' + esc(dayLabel(date)) + '</div>' +
    appts.map(cardHtml).join('') + '</div>'
  ).join('');
}

function cardHtml(a){
  const status = a.status || 'pending';
  const shopName = salon.name || 'the clinic';
  const msg = encodeURIComponent('Hi ' + a.name + ', this is a reminder from ' + shopName + ' — your ' + a.service + ' appointment is ' + dayLabel(a.date) + ' at ' + a.time + '. Reply YES to confirm or let us know if you need to reschedule.');
  const wa = 'https://wa.me/91' + String(a.phone).replace(/\D/g,'') + '?text=' + msg;
  return '<div class="card">' +
    '<div class="c-top"><div class="c-name">' + esc(a.name) + '<span class="badge ' + status + '">' + badgeLabel[status] + '</span></div><div class="c-time">' + esc(a.time) + '</div></div>' +
    '<div class="c-meta">' + esc(a.service) + ' · ' + esc(a.phone) + '</div>' +
    '<div class="c-actions">' +
      '<a class="wa" href="' + wa + '" target="_blank" rel="noopener" data-act="remind" data-id="' + a.id + '">Remind</a>' +
      '<button class="' + (status === 'noshow' ? 'on' : '') + '" data-act="noshow" data-id="' + a.id + '">No-show</button>' +
      '<button data-act="cancel" data-id="' + a.id + '">Cancel</button>' +
    '</div></div>';
}

function markStatus(id, status){
  const a = currentAppts.find(x => x.id === id);
  const next = (a && a.status === status) ? 'pending' : status;
  salonRef.collection('appointments').doc(id).update({ status: next }).catch(()=>{});
}

function cancelAppt(id){
  const a = currentAppts.find(x => x.id === id);
  if (!a) return;
  const batch = db.batch();
  batch.delete(salonRef.collection('appointments').doc(id));
  if (a.slotId) batch.delete(salonRef.collection('slots').doc(a.slotId));
  batch.commit().catch(()=>{});
}

function exportPdf(){
  const rows = currentAppts.filter(a => a.date >= todayISO());
  if (rows.length === 0){ alert('No upcoming bookings to export.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const mx = 14; let y = 20;
  const shopName = salon.name || 'Bookline';

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(shopName, mx, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(120);
  doc.text('Upcoming appointments — exported ' + new Date().toLocaleDateString(), mx, y); y += 10;
  doc.setTextColor(0);

  const col = { name:mx, date:62, service:96, time:140, status:168 };
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Name',col.name,y); doc.text('Date',col.date,y); doc.text('Service',col.service,y);
  doc.text('Time',col.time,y); doc.text('Status',col.status,y);
  y += 2; doc.setDrawColor(200); doc.line(mx,y,196,y); y += 6;

  doc.setFont('helvetica','normal');
  rows.forEach(a => {
    if (y > 280){ doc.addPage(); y = 20; }
    doc.text(String(a.name).slice(0,20), col.name, y);
    doc.text(dayLabel(a.date), col.date, y);
    doc.text(String(a.service).slice(0,16), col.service, y);
    doc.text(String(a.time), col.time, y);
    doc.text(badgeLabel[a.status || 'pending'], col.status, y);
    y += 8;
  });

  const reminded = rows.filter(a => a.status === 'reminded').length;
  const noshow = rows.filter(a => a.status === 'noshow').length;
  y += 4; doc.setDrawColor(200); doc.line(mx,y,196,y); y += 8;
  doc.setFont('helvetica','bold');
  doc.text(rows.length + ' total  ·  ' + reminded + ' reminded  ·  ' + noshow + ' no-shows', mx, y);
  doc.save('appointments.pdf');
}
</script>
</body>
</html>
