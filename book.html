<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookline — Book an appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (compat build — simplest to use without a bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{ --plum:#3B1F2B; --blush:#EBD4CF; --gold:#B8925A; --cream:#FBF7F2; --ink:#241419; --line:#E4D7CE; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  h1,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;}
  .wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
  header{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  header h1{font-size:1.5rem;color:var(--plum);}
  header p{margin:4px 0 0;font-size:.85rem;opacity:.65;}
  main{flex:1;padding:20px;}
  label{display:block;font-size:.78rem;font-weight:600;opacity:.6;margin:16px 0 6px;}
  label:first-child{margin-top:0;}
  input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--cream);color:var(--ink);font-family:'Inter';font-size:.95rem;}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
  .slot{padding:10px 4px;text-align:center;border:1px solid var(--line);border-radius:8px;font-size:.85rem;cursor:pointer;}
  .slot.taken{opacity:.3;text-decoration:line-through;cursor:not-allowed;}
  .slot.selected{background:var(--plum);color:var(--blush);border-color:var(--plum);}
  .btn{width:100%;margin-top:22px;padding:14px;border:none;border-radius:10px;background:var(--plum);color:var(--blush);font-weight:600;font-size:.95rem;cursor:pointer;}
  .btn:disabled{opacity:.5;}
  .confirm{text-align:center;padding:40px 10px;}
  .confirm .check{width:52px;height:52px;border-radius:50%;background:var(--plum);color:var(--blush);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.4rem;}
  .hint{font-size:.78rem;opacity:.55;margin-top:10px;line-height:1.5;}
  .error{color:#c0392b;font-size:.85rem;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="salonName">Bookline</h1>
    <p>Book your appointment</p>
  </header>
  <main id="mainArea">
    <p class="hint">Loading…</p>
  </main>
</div>

<script>
/* ============ 1. FILL THIS IN after creating your Firebase project ============
   Firebase console → Project settings → General → "Your apps" → Web app → Config */
const firebaseConfig = {
  apiKey: "AIzaSyDvv_BQGPWCjTyrBpOvtZZyNkFg1a9ugCo",
  authDomain: "bookline-280c4.firebaseapp.com",
  projectId: "bookline-280c4",
  storageBucket: "bookline-280c4.firebasestorage.app",
  messagingSenderId: "1066747513253",
  appId: "1:1066747513253:web:d0c7f3c79fc0b576dac04c"
};
/* ================================================================================ */

if (typeof firebase === 'undefined' || firebaseConfig.apiKey === 'YOUR_API_KEY') {
  document.getElementById('mainArea').innerHTML =
    '<p class="error">Setup not finished. (1) Paste your real Firebase config into this file, and (2) open this page from your hosted link (e.g. GitHub Pages), not from a preview inside another app.</p>';
  throw new Error('Setup incomplete');
}

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const SLOT_TIMES = ["10:00 AM","11:00 AM","12:00 PM","1:30 PM","3:00 PM","4:00 PM","5:00 PM","6:00 PM","7:00 PM"];
const params = new URLSearchParams(location.search);
const salonId = params.get('salon');
let selectedSlot = null;

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatDateLabel(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const date = new Date(y,m-1,d);
  const tmr = new Date(); tmr.setDate(tmr.getDate()+1);
  const tmrStr = tmr.getFullYear()+'-'+String(tmr.getMonth()+1).padStart(2,'0')+'-'+String(tmr.getDate()).padStart(2,'0');
  if(iso===todayISO()) return 'Today';
  if(iso===tmrStr) return 'Tomorrow';
  return date.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
}

const main = document.getElementById('mainArea');

if(!salonId){
  main.innerHTML = '<p class="error">No salon specified. This link is missing its ?salon= id.</p>';
} else {
  db.collection('salons').doc(salonId).get().then(doc=>{
    if(!doc.exists){
      main.innerHTML = '<p class="error">This booking link isn\'t set up yet.</p>';
      return;
    }
    document.getElementById('salonName').textContent = doc.data().name || 'Bookline';
    renderForm();
  }).catch(()=>{
    main.innerHTML = '<p class="error">Couldn\'t load this page. Check your connection and reload.</p>';
  });
}

function renderForm(){
  main.innerHTML = `
    <div id="bookForm">
      <label>Your name</label><input id="custName" placeholder="e.g. Priya Reddy">
      <label>Phone (for WhatsApp reminder)</label><input id="custPhone" placeholder="e.g. 9876543210" inputmode="tel">
      <label>Service</label>
      <select id="service"><option>Haircut</option><option>Hair color</option><option>Facial</option><option>Consultation</option></select>
      <label>Date</label><input type="date" id="apptDate">
      <label>Pick a slot</label>
      <div class="slots" id="slotGrid"><p class="hint">Loading slots…</p></div>
      <button class="btn" id="confirmBtn" disabled>Confirm booking</button>
      <div id="formError"></div>
    </div>
    <div id="bookDone" style="display:none" class="confirm">
      <div class="check">✓</div><h3>Booking confirmed</h3><p class="hint" id="doneText"></p>
    </div>`;

  const dateInput = document.getElementById('apptDate');
  dateInput.min = todayISO();
  dateInput.value = todayISO();
  dateInput.onchange = ()=>{ if(!dateInput.value) dateInput.value = todayISO(); selectedSlot=null; watchSlots(); };
  watchSlots();

  document.getElementById('confirmBtn').onclick = async ()=>{
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const service = document.getElementById('service').value;
    const date = dateInput.value || todayISO();
    const errEl = document.getElementById('formError');
    errEl.textContent = '';
    if(!name || !phone || !selectedSlot){
      errEl.innerHTML = '<p class="error">Fill your name, phone, and pick a slot first.</p>';
      return;
    }
    const btn = document.getElementById('confirmBtn');
    btn.disabled = true; btn.textContent = 'Booking…';
    try{
      // Slot id is unique per date+time, so two people can never both book it:
      // the second write fails and the whole batch is rejected.
      const slotId = date + '_' + selectedSlot.replace(/[^0-9A-Za-z]/g,'');
      const salonRef = db.collection('salons').doc(salonId);
      const batch = db.batch();
      batch.set(salonRef.collection('slots').doc(slotId), { date, time: selectedSlot });
      batch.set(salonRef.collection('appointments').doc(), {
        name, phone, service, date, time: selectedSlot, slotId, status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await batch.commit();
      document.getElementById('bookForm').style.display = 'none';
      document.getElementById('bookDone').style.display = 'block';
      document.getElementById('doneText').textContent =
        `${name}, your ${service} is booked for ${formatDateLabel(date)} ${selectedSlot}. You'll get a WhatsApp reminder before your slot.`;
    }catch(e){
      errEl.innerHTML = '<p class="error">That slot may have just been taken, or something went wrong — pick a slot and try again.</p>';
      watchSlots();
      btn.disabled = false; btn.textContent = 'Confirm booking';
    }
  };
}

let unsubSlots = null;
function watchSlots(){
  if(unsubSlots) unsubSlots();
  const date = document.getElementById('apptDate').value || todayISO();
  unsubSlots = db.collection('salons').doc(salonId).collection('slots')
    .where('date','==',date)
    .onSnapshot(snap=>{
      const taken = new Set(snap.docs.map(d=>d.data().time));
      const grid = document.getElementById('slotGrid');
      grid.innerHTML = '';
      SLOT_TIMES.forEach(t=>{
        const isTaken = taken.has(t);
        const div = document.createElement('div');
        div.className = 'slot' + (isTaken?' taken':'') + (selectedSlot===t?' selected':'');
        div.textContent = t;
        if(!isTaken) div.onclick = ()=>{ selectedSlot = t; document.getElementById('confirmBtn').disabled=false; watchSlots(); };
        grid.appendChild(div);
      });
      if(selectedSlot && taken.has(selectedSlot)){ selectedSlot=null; document.getElementById('confirmBtn').disabled=true; }
    }, ()=>{ document.getElementById('slotGrid').innerHTML = '<p class="error">Couldn\'t load slots.</p>'; });
}
</script>
</body>
</html>
